<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 380"><rect width="1100" height="380" fill="#FAFAF8"/><style>text{font-family:Inter,Arial}.h{font-size:22px;font-weight:700;fill:#142638}.s{font-size:16px;fill:#64717D}.b{fill:#fff;stroke:#D7DDDF;stroke-width:2}.t{fill:#E7F0EF;stroke:#39767A;stroke-width:2}.ln{stroke:#526D82;stroke-width:2;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 0 6 9 3z" fill="#526D82"/></marker></defs><text class="h" x="55" y="55">Semantic context demo — architecture</text><g transform="translate(55 130)"><rect class="b" width="180" height="110" rx="8"/><text class="h" x="90" y="46" text-anchor="middle">Query</text><text class="s" x="90" y="76" text-anchor="middle">user language</text><path class="ln" d="M184 55 L250 55"/><g transform="translate(255 0)"><rect class="t" width="235" height="110" rx="8"/><text class="h" x="117" y="42" text-anchor="middle">Context engine</text><text class="s" x="117" y="73" text-anchor="middle">entities + relationships</text></g><path class="ln" d="M494 55 L560 55"/><g transform="translate(565 0)"><rect class="b" width="210" height="110" rx="8"/><text class="h" x="105" y="42" text-anchor="middle">Documents</text><text class="s" x="105" y="73" text-anchor="middle">synthetic evidence</text></g><path class="ln" d="M779 55 L845 55"/><g transform="translate(850 0)"><rect class="b" width="190" height="110" rx="8"/><text class="h" x="95" y="42" text-anchor="middle">Ranked results</text><text class="s" x="95" y="73" text-anchor="middle">score + reasons</text></g></g><text class="s" x="55" y="315">Teaching artifact: no external model API, embeddings or employer data.</text></svg>
